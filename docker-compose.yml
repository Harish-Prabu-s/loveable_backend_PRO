version: '3.8'

services:
  backend:
    build: .
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    env_file:
      - .env
    command: python manage.py runserver 0.0.0.0:8001

  celery-worker:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    command: celery -A vibely_backend worker -l info --concurrency=4
    depends_on:
      - backend

  celery-beat:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    command: celery -A vibely_backend beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - backend

  turn:
    build:
      context: ./docker/turn
      dockerfile: Dockerfile
    ports:
      - "3478:3478/udp"
      - "3478:3478"
      - "5349:5349/udp"
      - "5349:5349"
    restart: always
    network_mode: host # Recommended for TURN servers to avoid port mapping overhead
